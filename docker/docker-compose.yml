services:

  postgres:

    image: postgres:17

    container_name: connectsphere-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: connectsphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 89327934

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data: